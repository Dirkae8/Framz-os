---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# FRAMZ OS — ПОЛНАЯ (Studio) редакция: творческие приложения уже внутри.
# Графика, 3D, видео, звук — можно работать сразу после установки, без магазина.
# Образ: ghcr.io/<owner>/framz-studio
name: framz-studio
description: FRAMZ OS Studio — полный творческий набор приложений внутри образа

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      skip-unavailable: true
      packages:
        - pipewire-jack-audio-connection-kit
        - qjackctl
        - libwacom
        - libwacom-data
        - colord
        - colord-extra-profiles
        - argyllcms
        - jetbrains-mono-fonts-all
        - google-noto-sans-fonts
        - google-noto-color-emoji-fonts
        - btop
        - kde-connect
        - partitionmanager
        - ark
        - filelight
        - distrobox
        - podman
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Творческий набор — ставится в образ, доступен сразу после установки --------
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          # браузер и служебное
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          # графика и иллюстрация
          - org.kde.krita
          - org.inkscape.Inkscape
          - org.gimp.GIMP
          - net.scribus.Scribus
          # 3D
          - org.blender.Blender
          # фото
          - org.darktable.Darktable
          # видео и стрим
          - org.kde.kdenlive
          - com.obsproject.Studio
          # звук
          - org.ardour.Ardour
          # документы
          - org.libreoffice.LibreOffice
      - scope: user

  # Название системы — ПОСЛЕ установки пакетов: модуль меняет VERSION_ID,
  # а dnf/flatpak используют его для выбора репозиториев Fedora.
  - type: os-release
    properties:
      ID: framz
      ID_LIKE: fedora
      NAME: FRAMZ OS
      PRETTY_NAME: FRAMZ OS 1.0 Studio
      VARIANT: FRAMZ OS Studio
      VARIANT_ID: framz-studio
      VERSION: "1.0"
      VERSION_ID: "1.0"
      VERSION_CODENAME: FRAMZ
      LOGO: framz-logo
      DEFAULT_HOSTNAME: framz
      HOME_URL: https://github.com/Dirkae8/Framz-os
      DOCUMENTATION_URL: https://github.com/Dirkae8/Framz-os/tree/main/docs
      SUPPORT_URL: https://github.com/Dirkae8/Framz-os/issues
      BUG_REPORT_URL: https://github.com/Dirkae8/Framz-os/issues
      VENDOR_NAME: FRAMZ OS
      VENDOR_URL: https://github.com/Dirkae8/Framz-os

