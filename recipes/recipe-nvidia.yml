---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# FRAMZ OS — редакция NVIDIA: проприетарный драйвер уже внутри.
# Для 3D-рендера (Blender/CUDA), монтажа (NVENC) и профессиональных GPU.
# Образ: ghcr.io/<owner>/framz-nvidia
#
# База — образ Universal Blue для KDE с NVIDIA: драйвер и модули ядра
# поддерживаются и обновляются вместе с системой, а не «накладываются» руками.
name: framz-nvidia
description: FRAMZ OS (NVIDIA) — драйвер NVIDIA и CUDA из коробки

base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: os-release
    properties:
      ID: framz
      ID_LIKE: fedora
      NAME: FRAMZ OS
      PRETTY_NAME: FRAMZ OS 1.0 (NVIDIA)
      VARIANT: FRAMZ OS NVIDIA
      VARIANT_ID: framz-nvidia
      VERSION: "1.0"
      VERSION_ID: "1.0"
      VERSION_CODENAME: FRAMZ
      LOGO: framz-logo
      DEFAULT_HOSTNAME: framz
      HOME_URL: https://github.com/Dirkae8/Framz-os
      DOCUMENTATION_URL: https://github.com/Dirkae8/Framz-os/tree/main/docs
      SUPPORT_URL: https://github.com/Dirkae8/Framz-os/issues
      BUG_REPORT_URL: https://github.com/Dirkae8/Framz-os/issues
      VENDOR_NAME: FRAMZ OS
      VENDOR_URL: https://github.com/Dirkae8/Framz-os

  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      skip-unavailable: true
      packages:
        - pipewire-jack-audio-connection-kit
        - qjackctl
        - libwacom
        - libwacom-data
        - colord
        - colord-extra-profiles
        - argyllcms
        - jetbrains-mono-fonts-all
        - google-noto-sans-fonts
        - google-noto-color-emoji-fonts
        - btop
        - kde-connect
        - partitionmanager
        - ark
        - filelight
        - distrobox
        - podman
      remove:
        packages:
          - firefox
          - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
      - scope: user
