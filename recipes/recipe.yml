---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# FRAMZ OS — рецепт образа.
# Образ публикуется как ghcr.io/<owner>/framz:<tag>
name: framz
description: FRAMZ OS — творческая система на базе Fedora Atomic KDE

# Официальная атомарная Fedora с KDE (Kinoite). Тег = номер релиза Fedora.
# 44 — текущий стабильный релиз. После выхода Fedora 45 (20.10.2026) проверить и обновить.
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  # ---------------------------------------------------------------------------
  # 1. Файлы: брендинг, настройки по умолчанию, скелет домашнего каталога.
  #    Всё из files/system/ копируется в корень образа.
  # ---------------------------------------------------------------------------
  - type: files
    files:
      - source: system
        destination: /

  # ---------------------------------------------------------------------------
  # 2. Репозитории и пакеты.
  #    Включаем RPM Fusion (кодеки, проприетарные драйверы в будущем).
  #    skip-unavailable: пакет, которого нет в репозиториях, не провалит сборку.
  # ---------------------------------------------------------------------------
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      skip-unavailable: true
      packages:
        # — звук: низкая задержка, маршрутизация, JACK-совместимость
        - pipewire-jack-audio-connection-kit
        - qjackctl
        # — планшеты (Wacom/XPPen/Huion) и их калибровка
        - libwacom
        - libwacom-data
        # — цвет: профили и калибровка мониторов/принтеров
        - colord
        - colord-extra-profiles
        - argyllcms
        # — шрифты: интерфейс, код, эмодзи, кириллица
        - jetbrains-mono-fonts-all
        - google-noto-sans-fonts
        - google-noto-color-emoji-fonts
        # — утилиты для быта и связь с телефоном
        - btop
        - kde-connect
        - partitionmanager
        - ark
        - filelight
        # — контейнеры для «Мастерской» (проприетарный творческий софт)
        - distrobox
        - podman
    # TODO (этап 1.1): полный медиа-стек требует замены пакетов из Fedora на версии
    # из RPM Fusion (ffmpeg-free → ffmpeg). Делается секцией replace, проверяется
    # отдельной сборкой, чтобы не рисковать стабильностью образа:
    # replace:
    #   - from-repo: rpmfusion
    #     packages:
    #       - ffmpeg

  # ---------------------------------------------------------------------------
  # 3. Приложения, которые должны быть у всех: ставятся Flatpak'ами при сборке.
  # ---------------------------------------------------------------------------
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.mozilla.firefox          # браузер
          - com.github.tchx84.Flatseal   # управление правами Flatpak
          - io.github.flattool.Warehouse # управление приложениями и кэшем
      - scope: user                    # пользовательский репозиторий Flathub

  # ---------------------------------------------------------------------------
  # 4. Подпись образов (cosign + Secure Boot).
  #    Включить, когда у проекта будет доступ к секретам репозитория:
  #      bluebuild generate-keys --output-dir .
  #      cosign.key → секрет SIGNING_SECRET, cosign.pub → в репозиторий
  # ---------------------------------------------------------------------------
  # - type: signing

  # ---------------------------------------------------------------------------
  # 5. TODO (этап 2–3): наши собственные компоненты.
  #    - оболочка FRAMZ (тема, панель, док, лаунчер)
  #    - FRAMZ Setup (мастер первого запуска)
  #    - FRAMZ Store (форк Discover с брендингом)
  # Пример:
  # - type: dnf
  #   repos:
  #     copr:
  #       - framz-os/framz-shell
  #   install:
  #     packages:
  #       - framz-look-and-feel
  #       - framz-shell
  #       - framz-setup
