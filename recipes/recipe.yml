---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# FRAMZ OS — ЕДИНЫЙ образ для всех устройств (как у обычных дистрибутивов).
# Внутри уже всё: система, оформление FRAMZ, творческий набор приложений.
# Образ: ghcr.io/<owner>/framz   ·   ISO: framz-os-1.0.iso
#
# ВАЖНО про порядок модулей: os-release идёт ПОСЛЕДНИМ, потому что он меняет
# VERSION_ID, а dnf и flatpak по нему выбирают репозитории Fedora.
name: framz
description: FRAMZ OS — творческая система на базе Fedora Atomic KDE (единый образ для всех)

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  # 1. Оформление FRAMZ, настройки системы, брендинг --------------------------
  - type: files
    files:
      - source: system
        destination: /

  # 2. Пакеты под творческие задачи ------------------------------------------
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      skip-unavailable: true
      packages:
        # звук без задержек
        - pipewire-jack-audio-connection-kit
        - qjackctl
        # графические планшеты
        - libwacom
        - libwacom-data
        # цвет: профили и калибровка
        - colord
        - colord-extra-profiles
        - argyllcms
        # шрифты
        - jetbrains-mono-fonts-all
        - google-noto-sans-fonts
        - google-noto-color-emoji-fonts
        # утилиты
        - btop
        - kde-connect
        - partitionmanager
        - ark
        - filelight
        # контейнеры для «Мастерской»
        - distrobox
        - podman
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # 3. Творческий набор: ставится Flatpak'ами в образ, доступен сразу --------
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          # браузер и служебное
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          # графика и иллюстрация
          - org.kde.krita
          - org.inkscape.Inkscape
          - org.gimp.GIMP
          - net.scribus.Scribus
          # 3D
          - org.blender.Blender
          # фото
          - org.darktable.Darktable
          # видео и стрим
          - org.kde.kdenlive
          - com.obsproject.Studio
          # звук
          - org.ardour.Ardour
          # документы
          - org.libreoffice.LibreOffice
      - scope: user

  # 4. Название системы (идёт последним — см. примечание в шапке) -------------
  - type: os-release
    properties:
      ID: framz
      ID_LIKE: fedora
      NAME: FRAMZ OS
      PRETTY_NAME: FRAMZ OS 1.0
      VARIANT: FRAMZ OS
      VARIANT_ID: framz
      VERSION: "1.0"
      VERSION_ID: "1.0"
      VERSION_CODENAME: FRAMZ
      LOGO: framz-logo
      DEFAULT_HOSTNAME: framz
      HOME_URL: https://github.com/Dirkae8/Framz-os
      DOCUMENTATION_URL: https://github.com/Dirkae8/Framz-os/tree/main/docs
      SUPPORT_URL: https://github.com/Dirkae8/Framz-os/issues
      BUG_REPORT_URL: https://github.com/Dirkae8/Framz-os/issues
      VENDOR_NAME: FRAMZ OS
      VENDOR_URL: https://github.com/Dirkae8/Framz-os

  # 5. Подпись образов — включим к публичной бете ----------------------------
  # - type: signing
