---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# FRAMZ OS — БАЗОВАЯ редакция: лёгкая система + магазин.
# Образ: ghcr.io/<owner>/framz
name: framz
description: FRAMZ OS — творческая система на базе Fedora Atomic KDE (базовая редакция)

# Официальная атомарная Fedora с KDE (Kinoite). Тег = номер релиза Fedora.
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  # 1. Брендинг, тема FRAMZ, настройки системы ---------------------------------
  - type: files
    files:
      - source: system
        destination: /

  # 2. Название системы: в терминале и «О системе» видно FRAMZ OS ------------
  - type: os-release
    properties:
      ID: framz
      ID_LIKE: fedora
      NAME: FRAMZ OS
      PRETTY_NAME: FRAMZ OS 1.0
      VARIANT: FRAMZ OS
      VARIANT_ID: framz
      VERSION: "1.0"
      VERSION_ID: "1.0"
      VERSION_CODENAME: FRAMZ
      LOGO: framz-logo
      DEFAULT_HOSTNAME: framz
      HOME_URL: https://github.com/Dirkae8/Framz-os
      DOCUMENTATION_URL: https://github.com/Dirkae8/Framz-os/tree/main/docs
      SUPPORT_URL: https://github.com/Dirkae8/Framz-os/issues
      BUG_REPORT_URL: https://github.com/Dirkae8/Framz-os/issues
      VENDOR_NAME: FRAMZ OS
      VENDOR_URL: https://github.com/Dirkae8/Framz-os

  # 3. Пакеты под творческие задачи ------------------------------------------
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
    install:
      skip-unavailable: true
      packages:
        # звук без задержек
        - pipewire-jack-audio-connection-kit
        - qjackctl
        # графические планшеты
        - libwacom
        - libwacom-data
        # цвет: профили и калибровка
        - colord
        - colord-extra-profiles
        - argyllcms
        # шрифты
        - jetbrains-mono-fonts-all
        - google-noto-sans-fonts
        - google-noto-color-emoji-fonts
        # утилиты
        - btop
        - kde-connect
        - partitionmanager
        - ark
        - filelight
        # контейнеры для «Мастерской»
        - distrobox
        - podman
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # 4. Приложения, которые должны быть у всех --------------------------------
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
      - scope: user

  # 5. Подпись образов — включим к публичной бете ----------------------------
  # - type: signing
