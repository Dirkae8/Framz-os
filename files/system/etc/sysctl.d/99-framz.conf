# FRAMZ OS — настройки ядра «из коробки»: отзывчивость для игр, разработки
# и работы с медиа. Всё безопасное: ничего не ломает обычное использование.

# --- сеть: быстрее отклик, современное управление очередями ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 4096
net.ipv4.tcp_mtu_probing = 1

# --- память: меньше свопим, больше держим в кэше ---
# (для игр и рендера своп на диск — главный источник «фризов»)
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5

# --- игры и большие 3D-сцены: нужен большой лимит карт памяти ---
vm.max_map_count = 2147483642

# --- разработка: файловые наблюдатели (сборщики, IDE, редакторы) ---
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152

# --- рабочий стол под нагрузкой: не «залипать» при сборке и рендере ---
kernel.sched_autogroup_enabled = 1

# --- перенесено из прежнего файла настроек ---
kernel.sched_rt_runtime_us = 950000
