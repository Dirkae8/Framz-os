# Системные настройки FRAMZ OS
# Создано для творческих задач: низкая задержка, отзывчивость, меньше «залипаний» на диск.

# --- Аудио: низкая задержка и стабильность записи -------------------------------
vm.swappiness = 10
vm.max_map_count = 1048576
# Разрешаем realtime-приоритеты для PipeWire/JACK
kernel.sched_rt_runtime_us = 950000

# --- Отзывчивость интерфейса ----------------------------------------------------
kernel.sched_autogroup_enabled = 0
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# --- Пиковая производительность для рендера и сборки ----------------------------
vm.vfs_cache_pressure = 50
