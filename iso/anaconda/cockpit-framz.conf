# FRAMZ OS — настройки установщика (Anaconda WebUI через Cockpit).
# Подключается как drop-in: /etc/anaconda/cockpit/conf.d/50-framz.conf
#
# Branding — имя каталога оформления, который мы кладём в
#   /usr/share/cockpit/branding/framz/
# LoginTitle — заголовок окна установщика.

[WebService]
Branding = framz
LoginTitle = Установка FRAMZ OS
