name: build-framz

# Собирает образ FRAMZ OS и установочный ISO.
# Образ публикуется в ghcr.io/<владелец-в-нижнем-регистре>/framz
# ISO складывается в артефакты запуска и в Releases (см. docs/START-HERE.md).

on:
  # Ручной запуск из веб-интерфейса GitHub (Actions → build-framz → Run workflow).
  workflow_dispatch:
  # Автосборка при изменениях, влияющих на образ.
  push:
    branches:
      - main
      - arena/01a0ee0e-framz-os
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/workflows/build.yml"
  # Ежедневная пересборка: свежая база Fedora + свежие обновления.
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: read

concurrency:
  group: build-framz-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: framz
  # Версия Fedora: должна совпадать с image-version в recipes/recipe.yml
  FEDORA_VERSION: "44"
  ISO_NAME: framz-os-1.0.iso
  INSTALLER_IMAGE: ghcr.io/jasonn3/build-container-installer:v1.5.0
  BLUEBUILD_INSTALLER: ghcr.io/blue-build/cli:v0.9-installer

jobs:
  # ===========================================================================
  # 1. Образ системы
  # ===========================================================================
  image:
    name: Образ FRAMZ OS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      namespace: ${{ steps.vars.outputs.namespace }}
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Определить имена
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          # имя образа в реестре должно быть в нижнем регистре
          NS="${GITHUB_REPOSITORY_OWNER,,}"
          echo "namespace=${NS}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${NS}/${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Установить BlueBuild
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${BLUEBUILD_INSTALLER}"
          sudo docker create --name bluebuild-installer "${BLUEBUILD_INSTALLER}"
          sudo docker cp bluebuild-installer:/out/bluebuild /usr/bin/bluebuild
          sudo docker rm bluebuild-installer
          bluebuild --version

      - name: Собрать и опубликовать образ
        shell: bash
        env:
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ steps.vars.outputs.namespace }}
          BB_USERNAME: ${{ github.actor }}
          BB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BB_BUILD_PUSH: "true"
          # Подпись включим, когда появятся секреты репозитория (этап беты).
          BB_BUILD_NO_SIGN: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: bluebuild build -v recipes/recipe.yml

  # ===========================================================================
  # 2. Установочный ISO из собранного образа
  # ===========================================================================
  iso:
    name: ISO FRAMZ OS
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # для создания Release и для логов в ci-logs/
      packages: read
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Определить тег опубликованного образа
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          NS="${{ needs.image.outputs.namespace }}"
          # BlueBuild создаёт тег latest только для ветки main, а для рабочей ветки —
          # br-<ветка>-<версия Fedora> (слэши в имени ветки заменяются на подчёркивания).
          REF="${GITHUB_REF_NAME//\//_}"
          CANDIDATE="br-${REF}-${FEDORA_VERSION}"

          # образ публичный, поэтому теги можно посмотреть без токена
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${NS}/${IMAGE_NAME}:pull&service=ghcr.io" | jq -r '.token')
          TAGS=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${NS}/${IMAGE_NAME}/tags/list" | jq -r '.tags[]?' || true)
          echo "Доступные теги: ${TAGS}"

          if echo "${TAGS}" | grep -qx "latest"; then
            TAG="latest"
          elif echo "${TAGS}" | grep -qx "${CANDIDATE}"; then
            TAG="${CANDIDATE}"
          elif [ -n "${TAGS}" ]; then
            TAG=$(echo "${TAGS}" | tail -1)
          else
            TAG="${CANDIDATE}" # реестр недоступен — используем вычисленный тег
          fi
          echo "Тег для ISO: ${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Собрать ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          LOG="$PWD/iso-build.log"
          # Установщик собирает ISO с Anaconda и зашивает в него ссылку на наш образ.
          # ВАЖНО: параметры передаются АРГУМЕНТАМИ (переменные make), а не через -e:
          # значения из Makefile.inputs внутри образа перекрывают переменные окружения,
          # из-за этого сборка уходила за дефолтной базой Fedora вместо нашего образа.
          # IMAGE_SIGNED=false — образ пока не подписан (preview).
          # Вывод целиком пишем в лог: его видно даже там, где артефакты GitHub недоступны.
          sudo docker run --privileged --rm \
            --volume "$PWD/output:/build-container-installer/build" \
            --volume framz-dnf-cache:/cache/dnf \
            "${INSTALLER_IMAGE}" \
            IMAGE_REPO="ghcr.io/${{ needs.image.outputs.namespace }}" \
            IMAGE_NAME="${IMAGE_NAME}" \
            IMAGE_TAG="${{ steps.tag.outputs.tag }}" \
            IMAGE_SIGNED="false" \
            VERSION="${FEDORA_VERSION}" \
            VARIANT="kinoite" \
            ISO_NAME="build/${ISO_NAME}" \
            WEB_UI="false" \
            DNF_CACHE="/cache/dnf" \
            _VOLID="FRAMZ_OS_1" 2>&1 | tee "${LOG}"
          ls -lh output/
          sha256sum "output/${ISO_NAME}" | tee "output/${ISO_NAME}-SHA256"

      - name: Загрузить ISO как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: framz-os-iso
          path: |
            output/${{ env.ISO_NAME }}
            output/${{ env.ISO_NAME }}-SHA256
          compression-level: 0 # ISO уже сжатый
          retention-days: 30

      - name: Приложить ISO к релизу
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "output/${ISO_NAME}")
          LIMIT=$((1900 * 1024 * 1024))
          if [ "${SIZE}" -le "${LIMIT}" ]; then
            FILES="output/${ISO_NAME} output/${ISO_NAME}-SHA256"
          else
            # GitHub не принимает файлы больше 2 ГиБ — режем на части
            split -b 1800M "output/${ISO_NAME}" "output/${ISO_NAME}.part-"
            (cd output && sha256sum ${ISO_NAME}.part-* > ${ISO_NAME}.parts-SHA256)
            FILES="output/${ISO_NAME}.part-* output/${ISO_NAME}.parts-SHA256 output/${ISO_NAME}-SHA256"
          fi
          NOTES="Первый публичный образ и установочный ISO FRAMZ OS.

          **Как установить — см. docs/START-HERE.md в репозитории.**

          - образ системы: \`${{ needs.image.outputs.image }}:${{ steps.tag.outputs.tag }}\`
          - вариант ISO: установщик Kinoite (Fedora Atomic KDE), версия Fedora ${{ env.FEDORA_VERSION }}
          - ISO не подписан (preview), в виртуальной машине лучше выключить Secure Boot

          Если ISO загружен частями (.part-*), соберите файл командой:
          \`cat ${ISO_NAME}.part-* > ${ISO_NAME}\`"
          if gh release view "v1.0-preview" >/dev/null 2>&1; then
            gh release upload "v1.0-preview" ${FILES} --clobber
          else
            gh release create "v1.0-preview" ${FILES} \
              --title "FRAMZ OS 1.0 (preview)" \
              --notes "${NOTES}"
          fi

      # Логи падений сохраняем в репозиторий: их видно через обычный git,
      # а артефакты GitHub из некоторых окружений недоступны.
      - name: Сохранить логи при сбое
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "=== запуск ${{ github.run_id }} (${{ github.ref_name }}) ==="
            echo "=== свободное место ==="
            df -h / /var/lib/docker 2>/dev/null || true
            echo
            echo "=== вывод сборки ISO ==="
            cat iso-build.log 2>/dev/null || echo "(файла нет — сборка не дошла до docker run)"
          } > "ci-logs/iso-failure-${{ github.run_id }}.txt"
          git config user.name "framz-ci"
          git config user.email "ci@framz.local"
          git add ci-logs
          git commit -m "ci: логи падения сборки ISO (${{ github.run_id }})" || true
          git push || true
