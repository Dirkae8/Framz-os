name: build-framz

# Собирает ТРИ редакции FRAMZ OS и по установочному ISO на каждую:
#   • framz          — базовая (лёгкая, творческий софт из магазина)   → framz-os-1.0.iso
#   • framz-nvidia   — с драйвером NVIDIA и CUDA из коробки            → framz-os-1.0-nvidia.iso
#   • framz-studio   — полная: Krita, GIMP, Blender, Kdenlive, ...     → framz-os-1.0-studio.iso
#
# ISO нужен любой: обычная, NVIDIA-редакция или полная — ставится на голый компьютер
# с флешки (docs/INSTALL-ON-PC.md) или запускается в виртуалке (docs/RUN-ON-GARUDA.md).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0ee0e-framz-os
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: read

concurrency:
  group: build-framz-${{ github.ref }}
  cancel-in-progress: false

env:
  FEDORA_VERSION: "44"
  INSTALLER_IMAGE: ghcr.io/jasonn3/build-container-installer:v1.5.0
  BLUEBUILD_INSTALLER: ghcr.io/blue-build/cli:v0.9-installer

jobs:
  # ===========================================================================
  # 1. Три образа
  # ===========================================================================
  image:
    name: Образ ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: recipe.yml
            image: framz
            title: Базовая
          - recipe: recipe-nvidia.yml
            image: framz-nvidia
            title: NVIDIA
          - recipe: recipe-studio.yml
            image: framz-studio
            title: Полная (Studio)
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Установить BlueBuild
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${BLUEBUILD_INSTALLER}"
          sudo docker create --name bluebuild-installer "${BLUEBUILD_INSTALLER}"
          sudo docker cp bluebuild-installer:/out/bluebuild /usr/bin/bluebuild
          sudo docker rm bluebuild-installer
          bluebuild --version

      - name: Собрать и опубликовать образ (${{ matrix.title }})
        shell: bash
        env:
          BB_REGISTRY: ghcr.io
          # имя образа в реестре должно быть в нижнем регистре
          BB_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          BB_USERNAME: ${{ github.actor }}
          BB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BB_BUILD_PUSH: "true"
          # Подпись включим, когда у проекта появятся секреты репозитория
          BB_BUILD_NO_SIGN: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: |
          set -o pipefail
          bluebuild build -v "recipes/${{ matrix.recipe }}" 2>&1 | tee build-image.log

      - name: Сохранить логи при сбое
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "=== образ ${{ matrix.image }} · запуск ${{ github.run_id }} · ветка ${{ github.ref_name }} ==="
            echo
            echo "=== вывод bluebuild (последние 300 строк) ==="
            tail -300 build-image.log 2>/dev/null || echo "(лог не найден — сборка не дошла до вызова bluebuild)"
          } > "ci-logs/image-failure-${{ github.run_id }}-${{ matrix.image }}.txt"
          git config user.name "framz-ci"
          git config user.email "ci@framz.local"
          git add ci-logs
          git commit -m "ci: логи падения сборки образа (${{ matrix.image }}, ${{ github.run_id }})" || true
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if git push origin "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1; then break; fi
            sleep 5
          done

  # ===========================================================================
  # 2. Установочный ISO на каждую редакцию
  # ===========================================================================
  iso:
    name: ISO ${{ matrix.image }}
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: framz
            title: Базовая
            iso: framz-os-1.0.iso
          - image: framz-nvidia
            title: NVIDIA
            iso: framz-os-1.0-nvidia.iso
          - image: framz-studio
            title: Полная (Studio)
            iso: framz-os-1.0-studio.iso
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Определить тег образа в реестре
        id: tag
        shell: bash
        env:
          NS: ${{ github.repository_owner }}
          IMG: ${{ matrix.image }}
        run: |
          set -euo pipefail
          NS="${NS,,}"   # в нижний регистр
          # BlueBuild даёт тег latest только для ветки main; для рабочих веток —
          # br-<ветка>-<версия Fedora>, слэши в имени ветки заменяются на подчёркивания.
          REF="${GITHUB_REF_NAME//\//_}"
          CANDIDATE="br-${REF}-${FEDORA_VERSION}"

          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${NS}/${IMG}:pull&service=ghcr.io" | jq -r '.token')
          TAGS=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${NS}/${IMG}/tags/list" | jq -r '.tags[]?' || true)
          echo "Теги образа ${IMG}: ${TAGS}"

          if echo "${TAGS}" | grep -qx "latest"; then
            TAG="latest"
          elif echo "${TAGS}" | grep -qx "${CANDIDATE}"; then
            TAG="${CANDIDATE}"
          elif [ -n "${TAGS}" ]; then
            TAG=$(echo "${TAGS}" | tail -1)
          else
            TAG="${CANDIDATE}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "namespace=${NS}" >> "${GITHUB_OUTPUT}"

      - name: Собрать ISO (${{ matrix.title }})
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          LOG="$PWD/iso-build.log"
          # Установщик принимает параметры АРГУМЕНТАМИ (переменные make), а не через -e:
          # значения из Makefile.inputs внутри образа перекрывают переменные окружения.
          sudo docker run --privileged --rm \
            --volume "$PWD/output:/build-container-installer/build" \
            --volume framz-dnf-cache:/cache/dnf \
            "${INSTALLER_IMAGE}" \
            IMAGE_REPO="ghcr.io/${{ steps.tag.outputs.namespace }}" \
            IMAGE_NAME="${{ matrix.image }}" \
            IMAGE_TAG="${{ steps.tag.outputs.tag }}" \
            IMAGE_SIGNED="false" \
            VERSION="${FEDORA_VERSION}" \
            VARIANT="kinoite" \
            ISO_NAME="build/${{ matrix.iso }}" \
            WEB_UI="false" \
            DNF_CACHE="/cache/dnf" \
            _VOLID="FRAMZ_OS_1" 2>&1 | tee "${LOG}"
          ls -lh output/
          # суммы без префикса пути — чтобы работал `sha256sum -c` рядом со скачанным файлом
          (cd output && sha256sum "${{ matrix.iso }}" > "${{ matrix.iso }}-SHA256")
          cat "output/${{ matrix.iso }}-SHA256"

      - name: Загрузить ISO как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.iso }}
          path: |
            output/${{ matrix.iso }}
            output/${{ matrix.iso }}-SHA256
          compression-level: 0
          retention-days: 30

      - name: Приложить ISO к релизу
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NS: ${{ steps.tag.outputs.namespace }}
          IMG: ${{ matrix.image }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ISO_NAME="${{ matrix.iso }}"
          SIZE=$(stat -c%s "output/${ISO_NAME}")
          LIMIT=$((1900 * 1024 * 1024))
          if [ "${SIZE}" -le "${LIMIT}" ]; then
            FILES="output/${ISO_NAME} output/${ISO_NAME}-SHA256"
          else
            # GitHub не принимает файлы больше 2 ГиБ — режем на части
            split -b 1800M "output/${ISO_NAME}" "output/${ISO_NAME}.part-"
            (cd output && sha256sum ${ISO_NAME}.part-* > ${ISO_NAME}.parts-SHA256)
            FILES="output/${ISO_NAME}.part-* output/${ISO_NAME}.parts-SHA256 output/${ISO_NAME}-SHA256"
          fi

          # проверяем, что релиз уже существует (могут писать параллельные задания)
          if ! gh release view "v1.0" >/dev/null 2>&1; then
            gh release create "v1.0" \
              --title "FRAMZ OS 1.0" \
              --notes-file .github/release-notes.md || true
          fi
          gh release upload "v1.0" ${FILES} --clobber

      - name: Сохранить логи при сбое
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "=== запуск ${{ github.run_id }} · ${{ matrix.image }} (${{ github.ref_name }}) ==="
            echo "=== свободное место ==="
            df -h / 2>/dev/null || true
            echo
            echo "=== вывод сборки ISO ==="
            cat iso-build.log 2>/dev/null || echo "(файла нет — сборка не дошла до docker run)"
          } > "ci-logs/iso-failure-${{ github.run_id }}-${{ matrix.image }}.txt"
          git config user.name "framz-ci"
          git config user.email "ci@framz.local"
          git add ci-logs
          git commit -m "ci: логи падения сборки ISO (${{ matrix.image }}, ${{ github.run_id }})" || true
          git push || true
