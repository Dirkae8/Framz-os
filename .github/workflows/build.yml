name: build-framz

# БЫСТРАЯ сборка: ОДИН образ и ОДИН установочный ISO для всех устройств.
#   образ: ghcr.io/<owner>/framz        ·   ISO: framz-os-1.0.iso
# Внутри уже всё: оформление FRAMZ + творческий набор (Krita, Blender, Kdenlive, OBS, Ardour…).
# NVIDIA-редакция собирается отдельным workflow (build-nvidia.yml) — по кнопке, чтобы не тратить время.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/01a0ee0e-framz-os
    paths:
      - "recipes/**"
      - "files/**"
      - "iso/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: read

concurrency:
  group: build-framz-${{ github.ref }}
  cancel-in-progress: true

env:
  FEDORA_VERSION: "44"
  IMAGE_NAME: framz
  ISO_NAME: framz-os-1.0.iso
  INSTALLER_IMAGE: ghcr.io/jasonn3/build-container-installer:v1.5.0
  BLUEBUILD_INSTALLER: ghcr.io/blue-build/cli:v0.9-installer

jobs:
  # ===========================================================================
  # 1. Образ системы
  # ===========================================================================
  image:
    name: Образ FRAMZ OS
    # Сборка НЕ запускается, если в сообщении коммита есть [skip ci] —
    # так обычные правки кода не тратят время. Собрать: коммит без [skip ci]
    # или кнопка Actions -> build-framz -> Run workflow.
    if: >-
      github.event_name != 'push'
      || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно, чтобы при сбое сохранять логи в ci-logs/
      packages: write
    outputs:
      namespace: ${{ steps.ns.outputs.namespace }}
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Имя владельца в нижнем регистре
        id: ns
        shell: bash
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Установить BlueBuild
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${BLUEBUILD_INSTALLER}"
          sudo docker create --name bluebuild-installer "${BLUEBUILD_INSTALLER}"
          sudo docker cp bluebuild-installer:/out/bluebuild /usr/bin/bluebuild
          sudo docker rm bluebuild-installer
          bluebuild --version

      - name: Собрать и опубликовать образ
        shell: bash
        env:
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ steps.ns.outputs.namespace }}
          BB_USERNAME: ${{ github.actor }}
          BB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BB_BUILD_PUSH: "true"
          BB_BUILD_NO_SIGN: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: |
          set -o pipefail
          bluebuild build -v recipes/recipe.yml 2>&1 | tee build-image.log

      - name: Сохранить логи при сбое
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "=== образ: ${{ env.IMAGE_NAME }} · запуск ${{ github.run_id }} · ветка ${{ github.ref_name }} ==="
            echo
            echo "=== вывод bluebuild (последние 300 строк) ==="
            tail -300 build-image.log 2>/dev/null || echo "(лог не найден)"
          } > "ci-logs/image-failure-${{ github.run_id }}.txt"
          git config user.name "framz-ci"
          git config user.email "ci@framz.local"
          git add ci-logs
          git commit -m "ci: логи падения сборки образа (${{ github.run_id }})" || true
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if git push origin "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1; then break; fi
            sleep 5
          done

  # ===========================================================================
  # 2. Установочный ISO (один для всех устройств)
  # ===========================================================================
  iso:
    name: ISO FRAMZ OS
    needs: image
    if: >-
      github.event_name != 'push'
      || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Собрать оформление установщика (наш шаблон для lorax)
        shell: bash
        run: bash iso/make-branding-template.sh iso/framz-branding.tmpl

      - name: Определить тег образа в реестре
        id: tag
        shell: bash
        env:
          NS: ${{ needs.image.outputs.namespace }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME//\//_}"
          CANDIDATE="br-${REF}-${FEDORA_VERSION}"
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${NS}/${IMAGE_NAME}:pull&service=ghcr.io" | jq -r '.token')
          TAGS=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${NS}/${IMAGE_NAME}/tags/list" | jq -r '.tags[]?' || true)
          if echo "${TAGS}" | grep -qx "latest"; then TAG="latest"
          elif echo "${TAGS}" | grep -qx "${CANDIDATE}"; then TAG="${CANDIDATE}"
          elif [ -n "${TAGS}" ]; then TAG=$(echo "${TAGS}" | tail -1)
          else TAG="${CANDIDATE}"; fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Тег образа: ${TAG} (доступные: ${TAGS})"

      # Кэш пакетов lorax: сильно ускоряет повторные сборки ISO
      - name: Кэш пакетов установщика
        uses: actions/cache@v4
        with:
          path: dnf-cache
          key: framz-iso-dnf-${{ env.FEDORA_VERSION }}-${{ github.run_id }}
          restore-keys: |
            framz-iso-dnf-${{ env.FEDORA_VERSION }}-

      - name: Собрать ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output dnf-cache
          LOG="$PWD/iso-build.log"
          : > "${LOG}"
          # Параметры передаются АРГУМЕНТАМИ make, а не через -e:
          # значения из Makefile.inputs внутри образа установщика перекрывают окружение.
          # Сборка тянет системный образ из реестра — при обрыве сети повторяем попытку.
          build_iso() {
          sudo docker run --privileged --rm \
            --volume "$PWD/output:/build-container-installer/build" \
            --volume "$PWD/dnf-cache:/cache/dnf" \
            --volume "$PWD/iso:/framz-iso:ro" \
            "${INSTALLER_IMAGE}" \
            IMAGE_REPO="ghcr.io/${{ needs.image.outputs.namespace }}" \
            IMAGE_NAME="${IMAGE_NAME}" \
            IMAGE_TAG="${{ steps.tag.outputs.tag }}" \
            IMAGE_SIGNED="false" \
            VERSION="${FEDORA_VERSION}" \
            VARIANT="kinoite" \
            ISO_NAME="build/${ISO_NAME}" \
            WEB_UI="false" \
            DNF_CACHE="/cache/dnf" \
            ADDITIONAL_TEMPLATES="/framz-iso/framz-branding.tmpl" \
            _VOLID="FRAMZ_OS_1" 2>&1 | tee -a "${LOG}"
          }
          OK=0
          for attempt in 1 2; do
            echo "=== попытка сборки ISO ${attempt} из 2 ===" | tee -a "${LOG}"
            if build_iso; then OK=1; break; fi
            echo "попытка ${attempt} не удалась — повторяем через минуту" | tee -a "${LOG}"
            sleep 60
          done
          if [ "${OK}" != "1" ]; then
            echo "сборка ISO не удалась после двух попыток" | tee -a "${LOG}"
            tail -30 "${LOG}" | tee -a "${LOG}"
            exit 1
          fi
          ls -lh output/
          # Фирменное меню загрузки ISO (пункты, фон, время ожидания).
          # Скрипт безопасный: не справился — ISO остаётся как был.
          bash scripts/iso-brand-boot.sh "output/${ISO_NAME}" || true
          (cd output && sha256sum "${ISO_NAME}" > "${ISO_NAME}-SHA256")
          cat "output/${ISO_NAME}-SHA256"

      - name: Проверить ISO и сохранить отчёт
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage squashfs-tools xorriso >/dev/null 2>&1 || true
          mkdir -p ci-logs
          REPORT="ci-logs/iso-check-${{ github.run_id }}.txt"
          bash scripts/iso-selfcheck.sh "output/${ISO_NAME}" > "${REPORT}" 2>&1 || true
          echo "=== текст отчёта ==="
          cat "${REPORT}"
          git config user.name "framz-ci"
          git config user.email "ci@framz.local"
          git add -f ci-logs
          git commit -m "ci: отчёт самопроверки ISO (${{ github.run_id }})" || true
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push origin "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1 && break || sleep 5
          done

      - name: Загрузить ISO как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            output/${{ env.ISO_NAME }}
            output/${{ env.ISO_NAME }}-SHA256
          compression-level: 0
          retention-days: 30

      - name: Приложить ISO к релизу
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NS: ${{ needs.image.outputs.namespace }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "output/${ISO_NAME}")
          LIMIT=$((1900 * 1024 * 1024))
          if [ "${SIZE}" -le "${LIMIT}" ]; then
            # ISO помещается целиком — отдаём одним файлом (удобнее, чем части)
            FILES="output/${ISO_NAME} output/${ISO_NAME}-SHA256"
          else
            split -b 1800M "output/${ISO_NAME}" "output/${ISO_NAME}.part-"
            (cd output && sha256sum ${ISO_NAME}.part-* > ${ISO_NAME}.parts-SHA256)
            FILES="output/${ISO_NAME}.part-* output/${ISO_NAME}.parts-SHA256 output/${ISO_NAME}-SHA256"
          fi
          if ! gh release view "v1.0" >/dev/null 2>&1; then
            gh release create "v1.0" --title "FRAMZ OS 1.0" --notes-file .github/release-notes.md || true
          fi
          gh release upload "v1.0" ${FILES} --clobber
          # Скрипты запуска/записи — рядом с ISO, чтобы можно было ставить одной командой
          gh release upload "v1.0" scripts/framz-quickstart.sh scripts/framz-vm.sh scripts/framz-usb.sh --clobber

      - name: Сохранить логи при сбое
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "=== ISO · запуск ${{ github.run_id }} · ветка ${{ github.ref_name }} ==="
            df -h / 2>/dev/null || true
            echo
            echo "=== вывод сборки ISO ==="
            cat iso-build.log 2>/dev/null || echo "(лог не найден)"
          } > "ci-logs/iso-failure-${{ github.run_id }}.txt"
          git config user.name "framz-ci"
          git config user.email "ci@framz.local"
          git add ci-logs
          git commit -m "ci: логи падения сборки ISO (${{ github.run_id }})" || true
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if git push origin "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1; then break; fi
            sleep 5
          done
