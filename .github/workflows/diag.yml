name: diag

# Диагностический прогон: проверяет рецепты и делает пробную сборку,
# ВСЕГДА сохраняя вывод в ci-logs/diag-<run>.txt (логи GitHub из песочницы недоступны).
# Запускается вручную: Actions → diag → Run workflow.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diag.yml"
      - "ci-trigger/**"

permissions:
  contents: write
  packages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Установить BlueBuild
        shell: bash
        env:
          BLUEBUILD_INSTALLER: ghcr.io/blue-build/cli:v0.9-installer
        run: |
          set -euo pipefail
          docker pull "${BLUEBUILD_INSTALLER}"
          sudo docker create --name bluebuild-installer "${BLUEBUILD_INSTALLER}"
          sudo docker cp bluebuild-installer:/out/bluebuild /usr/bin/bluebuild
          sudo docker rm bluebuild-installer
          bluebuild --version

      - name: Проверить рецепты и собрать пробно
        id: diag
        shell: bash
        env:
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          BB_BUILD_NO_SIGN: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: |
          {
            echo "=== ДИАГНОСТИКА · запуск ${{ github.run_id }} ==="
            echo "--- версия bluebuild ---"
            bluebuild --version 2>&1 || true
            echo
            echo "--- проверка рецептов ---"
            for r in recipes/recipe.yml recipes/recipe-nvidia.yml recipes/recipe-studio.yml; do
              echo "### $r"
              bluebuild validate "$r" 2>&1 || echo "(validate вернул ошибку)"
              echo
            done
            echo "--- пробная сборка базового рецепта (без публикации) ---"
            bluebuild build -v recipes/recipe.yml 2>&1 || echo "(сборка вернула ошибку)"
          } | tee /tmp/diag.log
          exit 0

      - name: Сохранить вывод в репозиторий
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p ci-logs
          {
            echo "=== образ: диагностика ==="
            echo "ветка: ${{ github.ref_name }}"
            echo
            tail -400 /tmp/diag.log 2>/dev/null || echo "(лог не найден)"
          } > "ci-logs/diag-${{ github.run_id }}.txt"
          wc -l ci-logs/diag-${{ github.run_id }}.txt
          git config user.name "framz-ci"
          git config user.email "ci@framz.local"
          git add ci-logs
          git commit -m "ci: диагностика сборки (${{ github.run_id }})" || true
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "PUSH OK"; break; fi
            sleep 5
          done
