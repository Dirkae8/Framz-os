name: build-nvidia

# Отдельная сборка NVIDIA-редакции — запускается ВРУЧНУЮ, чтобы не тратить время
# на каждую обычную сборку. Результат: ISO framz-os-1.0-nvidia.iso с драйвером
# NVIDIA и CUDA внутри (Blender-рендер, NVENC, DaVinci Resolve, CUDA-плагины).
#
# Запуск: Actions → build-nvidia → Run workflow.

on:
  workflow_dispatch:
  # Кнопка «Run workflow» появляется только у файлов с главной ветки.
  # Поэтому, пока сборка не влита в main, её можно запустить, тронув файл-метку:
  #   touch build-nvidia/trigger.txt && git commit && git push
  push:
    paths:
      - ".github/workflows/build-nvidia.yml"
      - "build-nvidia/**"

permissions:
  contents: read

concurrency:
  group: build-nvidia-${{ github.ref }}
  cancel-in-progress: false

env:
  FEDORA_VERSION: "44"
  IMAGE_NAME: framz-nvidia
  ISO_NAME: framz-os-1.0-nvidia.iso
  INSTALLER_IMAGE: ghcr.io/jasonn3/build-container-installer:v1.5.0
  BLUEBUILD_INSTALLER: ghcr.io/blue-build/cli:v0.9-installer

jobs:
  image:
    name: Образ FRAMZ OS (NVIDIA)
    if: >-
      github.event_name != 'push'
      || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      namespace: ${{ steps.ns.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      - name: Имя владельца в нижнем регистре
        id: ns
        shell: bash
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"

      - name: Установить BlueBuild
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${BLUEBUILD_INSTALLER}"
          sudo docker create --name bluebuild-installer "${BLUEBUILD_INSTALLER}"
          sudo docker cp bluebuild-installer:/out/bluebuild /usr/bin/bluebuild
          sudo docker rm bluebuild-installer
          bluebuild --version

      - name: Собрать и опубликовать образ
        shell: bash
        env:
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ steps.ns.outputs.namespace }}
          BB_USERNAME: ${{ github.actor }}
          BB_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BB_BUILD_PUSH: "true"
          BB_BUILD_NO_SIGN: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_LOG_STYLE: always
          CLICOLOR_FORCE: "1"
        run: |
          set -o pipefail
          bluebuild build -v recipes/recipe-nvidia.yml 2>&1 | tee build-image.log

      - name: Сохранить логи при сбое
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          { echo "=== NVIDIA · запуск ${{ github.run_id }} ==="; echo
            tail -300 build-image.log 2>/dev/null || echo "(лог не найден)"; } \
            > "ci-logs/image-failure-${{ github.run_id }}-nvidia.txt"
          git config user.name "framz-ci"; git config user.email "ci@framz.local"
          git add ci-logs && git commit -m "ci: логи падения сборки NVIDIA-образа" || true
          for a in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push origin "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1 && break || sleep 5
          done

  iso:
    name: ISO FRAMZ OS (NVIDIA)
    needs: image
    if: >-
      github.event_name != 'push'
      || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Определить тег образа
        id: tag
        shell: bash
        env:
          NS: ${{ needs.image.outputs.namespace }}
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME//\//_}"
          CANDIDATE="br-${REF}-${FEDORA_VERSION}"
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${NS}/${IMAGE_NAME}:pull&service=ghcr.io" | jq -r '.token')
          TAGS=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" \
            "https://ghcr.io/v2/${NS}/${IMAGE_NAME}/tags/list" | jq -r '.tags[]?' || true)
          if echo "${TAGS}" | grep -qx "latest"; then TAG="latest"
          elif echo "${TAGS}" | grep -qx "${CANDIDATE}"; then TAG="${CANDIDATE}"
          elif [ -n "${TAGS}" ]; then TAG=$(echo "${TAGS}" | tail -1)
          else TAG="${CANDIDATE}"; fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Кэш пакетов установщика
        uses: actions/cache@v4
        with:
          path: dnf-cache
          key: framz-nvidia-iso-dnf-${{ env.FEDORA_VERSION }}-${{ github.run_id }}
          restore-keys: |
            framz-nvidia-iso-dnf-${{ env.FEDORA_VERSION }}-

      - name: Собрать ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output dnf-cache
          LOG="$PWD/iso-build.log"
          sudo docker run --privileged --rm \
            --volume "$PWD/output:/build-container-installer/build" \
            --volume "$PWD/dnf-cache:/cache/dnf" \
            "${INSTALLER_IMAGE}" \
            IMAGE_REPO="ghcr.io/${{ needs.image.outputs.namespace }}" \
            IMAGE_NAME="${IMAGE_NAME}" \
            IMAGE_TAG="${{ steps.tag.outputs.tag }}" \
            IMAGE_SIGNED="false" \
            VERSION="${FEDORA_VERSION}" \
            VARIANT="kinoite" \
            ISO_NAME="build/${ISO_NAME}" \
            WEB_UI="false" \
            DNF_CACHE="/cache/dnf" \
            _VOLID="FRAMZ_NV_1" 2>&1 | tee "${LOG}"
          (cd output && sha256sum "${ISO_NAME}" > "${ISO_NAME}-SHA256")
          ls -lh output/

      - name: Загрузить ISO как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}
          path: |
            output/${{ env.ISO_NAME }}
            output/${{ env.ISO_NAME }}-SHA256
          compression-level: 0
          retention-days: 30

      - name: Приложить ISO к релизу
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "output/${ISO_NAME}")
          if [ "${SIZE}" -le $((1900 * 1024 * 1024)) ]; then
            FILES="output/${ISO_NAME} output/${ISO_NAME}-SHA256"
          else
            split -b 1800M "output/${ISO_NAME}" "output/${ISO_NAME}.part-"
            (cd output && sha256sum ${ISO_NAME}.part-* > ${ISO_NAME}.parts-SHA256)
            FILES="output/${ISO_NAME}.part-* output/${ISO_NAME}.parts-SHA256 output/${ISO_NAME}-SHA256"
          fi
          gh release upload "v1.0" ${FILES} --clobber

      - name: Сохранить логи при сбое
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          { echo "=== NVIDIA ISO · запуск ${{ github.run_id }} ==="; echo
            cat iso-build.log 2>/dev/null || echo "(лог не найден)"; } \
            > "ci-logs/iso-failure-${{ github.run_id }}-nvidia.txt"
          git config user.name "framz-ci"; git config user.email "ci@framz.local"
          git add ci-logs && git commit -m "ci: логи падения NVIDIA ISO" || true
          for a in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push origin "HEAD:${GITHUB_REF_NAME}" >/dev/null 2>&1 && break || sleep 5
          done
