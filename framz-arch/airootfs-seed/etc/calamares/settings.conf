# FRAMZ OS — сценарий установки (Calamares).
# Порядок шагов: язык → клавиатура → диск → пользователь → установка → готово.
# Установка офлайн: система распаковывается из образа на флешке, интернет не нужен.
---
branding: framz
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: true

sequence:
- show:
  - welcome
  - locale
  - keyboard
- exec:
  - partition
  - users
- show:
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - framz-initramfs
  - grubcfg
  - bootloader
  - displaymanager
  - services-systemd
  - umount
- show:
  - finished

# Наш шаг с initramfs (Plymouth + тема) описан отдельным модулем
# shellprocess с файлом framz-initramfs.conf — см. соседние файлы.
