# FRAMZ OS — меню загрузки (UEFI, GRUB). Первое, что видит человек с флешки.
# Оформление наше; сами команды загрузки — стандартные для archiso.

set default="0"
set timeout="15"
insmod all_video
# Наш фон, если он оказался на флешке
if [ -f /framz-boot/bg.png ]; then
    background_image /framz-boot/bg.png
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-gray

menuentry "Запустить FRAMZ OS (без установки)" --class arch --class gnu-linux --class os {
    search --no-floppy --set=root --label FRAMZ_ARCH_1
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=FRAMZ_ARCH_1 quiet splash loglevel=3
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Установить FRAMZ OS на диск" --class arch --class gnu-linux --class os {
    search --no-floppy --set=root --label FRAMZ_ARCH_1
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=FRAMZ_ARCH_1 quiet splash loglevel=3 framz_install=1
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Загрузить в память (быстрее после старта)" --class arch --class gnu-linux --class os {
    search --no-floppy --set=root --label FRAMZ_ARCH_1
    linux /arch/boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=FRAMZ_ARCH_1 copytoram quiet splash loglevel=3
    initrd /arch/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Перезагрузить" --class reboot {
    reboot
}

menuentry "Выключить" --class shutdown {
    halt
}
